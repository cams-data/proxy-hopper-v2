name: CI

on:
  push:
    branches-ignore:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run proxy-hopper tests
        working-directory: python_modules/proxy-hopper
        run: |
          uv sync --python ${{ matrix.python-version }} --all-extras
          uv run pytest --tb=short -q

      - name: Run proxy-hopper-redis tests
        working-directory: python_modules/proxy-hopper-redis
        run: |
          uv sync --python ${{ matrix.python-version }} --all-extras
          uv run pytest --tb=short -q

      - name: Run proxy-hopper-webserver tests
        working-directory: python_modules/proxy-hopper-webserver
        run: |
          uv sync --python ${{ matrix.python-version }} --all-extras
          uv run pytest --tb=short -q

      - name: Run proxy-hopper-sql tests
        working-directory: python_modules/proxy-hopper-sql
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        run: |
          uv sync --python ${{ matrix.python-version }} --all-extras
          uv run pytest --tb=short -q

      - name: Alembic multi-head guard
        working-directory: python_modules/proxy-hopper-sql
        run: |
          heads=$(uv run python -c "from proxy_hopper_sql import migrations; print(len(migrations.heads('sqlite+aiosqlite:///:memory:')))")
          if [ "$heads" != "1" ]; then
            echo "Expected exactly 1 Alembic head, found $heads — merge the migration branches." >&2
            exit 1
          fi

      - name: Run contract tests (all backends)
        working-directory: python_modules/tests
        env:
          REDIS_URL: redis://localhost:6379/0
          POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        run: |
          uv sync --python ${{ matrix.python-version }}
          uv run pytest --tb=short -q

      - name: Run integration tests
        working-directory: python_modules/proxy-hopper-testserver
        run: |
          uv sync --python ${{ matrix.python-version }} --all-extras
          uv run pytest --tb=short -q

  helm-lint:
    name: Helm lint / template
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/proxy-hopper

      - name: helm template — default values
        run: helm template test charts/proxy-hopper > /dev/null

      - name: helm template — redis backend + admin
        run: |
          helm template test charts/proxy-hopper \
            --set backend.type=redis --set redis.enabled=true --set admin.enabled=true \
            > /dev/null

      - name: helm template — configStore=sqlite
        run: |
          helm template test charts/proxy-hopper \
            --set configStore.dialect=sqlite --set admin.enabled=true \
            > /dev/null

      - name: helm template — configStore=postgres (url and existingSecret)
        run: |
          helm template test charts/proxy-hopper \
            --set configStore.dialect=postgres --set configStore.url=postgresql+asyncpg://u:p@host/db --set admin.enabled=true \
            > /dev/null
          helm template test charts/proxy-hopper \
            --set configStore.dialect=postgres --set configStore.existingSecret=my-secret --set admin.enabled=true \
            > /dev/null

      - name: helm template — configStore=sqlite single-writer guards must fail
        run: |
          if helm template test charts/proxy-hopper --set configStore.dialect=sqlite --set replicaCount=2 > /dev/null 2>&1; then
            echo "Expected 'helm template' to fail with replicaCount=2 + configStore.dialect=sqlite (single-writer guard regressed)." >&2
            exit 1
          fi
          if helm template test charts/proxy-hopper --set configStore.dialect=sqlite --set autoscaling.enabled=true > /dev/null 2>&1; then
            echo "Expected 'helm template' to fail with autoscaling.enabled + configStore.dialect=sqlite (single-writer guard regressed)." >&2
            exit 1
          fi
