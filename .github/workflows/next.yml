name: Next (pre-release)

on:
  push:
    branches:
      - next

jobs:
  # ---------------------------------------------------------------------------
  # Changes — detects pushes that touch only the Helm chart (charts/**).
  # Those skip the wheel build / multi-arch Docker build entirely and go
  # straight to the lightweight chart-only publish job below, instead of
  # bumping the app version and rebuilding images that haven't changed.
  # Defaults to "not chart-only" (i.e. runs the full pipeline) whenever the
  # diff can't be determined, e.g. on the branch's first push.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      chart_only: ${{ steps.check.outputs.chart_only }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether only chart files changed
        id: check
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "chart_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}")
          echo "Changed files:"
          echo "$CHANGED"

          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^charts/'; then
            echo "chart_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "chart_only=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Tag — reads conventional commits since the last tag and pushes a new one.
  # Pre-release tags are suffixed with '-pre.N' (e.g. v0.1.1-pre.1).
  # If no bump-worthy commits exist the step is a no-op (new_tag is empty).
  #
  # Tests are NOT re-run here — CI already requires them to pass on every PR
  # before it can be merged into next.
  #
  # Skipped entirely for chart-only pushes — see the "changes" job above and
  # "chart-only" job below.
  # ---------------------------------------------------------------------------
  tag:
    name: Tag pre-release
    needs: changes
    if: needs.changes.outputs.chart_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          pre_release_branches: next
          append_to_pre_release_tag: pre
          default_bump: patch
          tag_prefix: v

      - name: Strip tag prefix
        id: version
        if: steps.tag.outputs.new_tag != ''
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.tag.outputs.new_tag }}

  # ---------------------------------------------------------------------------
  # Build wheels + sdists, publish GitHub pre-release with release notes.
  # Uploads wheels as artifacts for the Docker job to consume.
  # ---------------------------------------------------------------------------
  build-and-release:
    name: Build & publish pre-release
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.new_tag }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        # For pre-releases: show all commits since the last stable tag so
        # users can see everything that will land in the next stable release.
        run: |
          git-cliff --config cliff.toml --unreleased --strip header > release-notes.md
          cat release-notes.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Build admin UI
        run: |
          cd admin-ui
          npm ci
          npm run build
          cp -r dist ../python_modules/proxy-hopper-webserver/src/proxy_hopper_webserver/ui/

      - name: Build wheels and sdists
        run: |
          uv build --wheel --sdist --out-dir dist python_modules/proxy-hopper
          uv build --wheel --sdist --out-dir dist python_modules/proxy-hopper-redis
          uv build --wheel --sdist --out-dir dist python_modules/proxy-hopper-webserver

      - name: Create GitHub pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.tag.outputs.new_tag }}" dist/* \
            --prerelease \
            --title "${{ needs.tag.outputs.new_tag }}" \
            --notes-file release-notes.md \
            --repo "${{ github.repository }}"

      - name: Upload wheels for Docker job
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Docker — multi-arch build (amd64 + arm64) pushed to ghcr.io.
  # After pushing, edits the GitHub release to add image links.
  #
  # Two images per pre-release:
  #   proxy-hopper:<version>        memory backend only
  #   proxy-hopper:<version>-redis  includes Redis backend
  #
  # Both also tagged :preview and :preview-redis (floating pre-release pointer).
  # ---------------------------------------------------------------------------
  docker:
    name: Build & push Docker images
    needs: [tag, build-and-release]
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: docker/wheels

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — memory backend
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxy-hopper:${{ needs.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/proxy-hopper:preview

      - name: Build and push — Redis backend
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.redis
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxy-hopper:${{ needs.tag.outputs.version }}-redis
            ghcr.io/${{ github.repository_owner }}/proxy-hopper:preview-redis

      - name: Add image links to release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cat >> image-links.md << EOF

          ## Docker images

          | Image | Pull command |
          |---|---|
          | Memory backend | \`docker pull ghcr.io/${OWNER}/proxy-hopper:${VERSION}\` |
          | Redis backend | \`docker pull ghcr.io/${OWNER}/proxy-hopper:${VERSION}-redis\` |

          Built for \`linux/amd64\` and \`linux/arm64\`.
          EOF

          gh release edit "${{ needs.tag.outputs.new_tag }}" \
            --notes-file <(gh release view "${{ needs.tag.outputs.new_tag }}" --json body --jq '.body' && cat image-links.md) \
            --repo "${{ github.repository }}"

  # ---------------------------------------------------------------------------
  # Helm — package the chart and push to ghcr.io OCI registry.
  # ---------------------------------------------------------------------------
  helm:
    name: Publish Helm chart
    needs: [tag, docker]
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update chart version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" charts/proxy-hopper/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/proxy-hopper/Chart.yaml

      - name: Fetch chart dependencies
        run: helm dependency update charts/proxy-hopper

      - name: Package chart
        run: helm package charts/proxy-hopper --destination /tmp/helm-charts

      - name: Push chart to ghcr.io
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          helm push /tmp/helm-charts/proxy-hopper-${VERSION}.tgz oci://ghcr.io/${OWNER}/helm

      - name: Add Helm install instructions to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cat >> helm-links.md << EOF

          ## Helm chart

          \`\`\`bash
          helm install proxy-hopper oci://ghcr.io/${OWNER}/helm/proxy-hopper --version ${VERSION}
          \`\`\`
          EOF

          gh release edit "${{ needs.tag.outputs.new_tag }}" \
            --notes-file <(gh release view "${{ needs.tag.outputs.new_tag }}" --json body --jq '.body' && cat helm-links.md) \
            --repo "${{ github.repository }}"

  # ---------------------------------------------------------------------------
  # Chart-only — for pushes that touch nothing but charts/**. Skips the app
  # version bump and image builds entirely; packages the chart pinned to the
  # most recently released app version (the latest "v*" tag) and pushes it to
  # ghcr.io under its own "<appVersion>-chart.<sha>" version, so it doesn't
  # collide with real release versions from the "helm" job above.
  # ---------------------------------------------------------------------------
  chart-only:
    name: Publish Helm chart (chart-only change)
    needs: changes
    if: needs.changes.outputs.chart_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine latest released app version
        id: app_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*')
          echo "version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update chart version
        id: chart_version
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          CHART_VERSION="${APP_VERSION}-chart.$(git rev-parse --short HEAD)"
          echo "version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" charts/proxy-hopper/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" charts/proxy-hopper/Chart.yaml

      - name: Fetch chart dependencies
        run: helm dependency update charts/proxy-hopper

      - name: Package chart
        run: helm package charts/proxy-hopper --destination /tmp/helm-charts

      - name: Push chart to ghcr.io
        env:
          CHART_VERSION: ${{ steps.chart_version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          helm push /tmp/helm-charts/proxy-hopper-${CHART_VERSION}.tgz oci://ghcr.io/${OWNER}/helm

      - name: Summary
        env:
          CHART_VERSION: ${{ steps.chart_version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "### Chart-only preview published"
            echo
            echo '```bash'
            echo "helm install proxy-hopper oci://ghcr.io/${OWNER}/helm/proxy-hopper --version ${CHART_VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
