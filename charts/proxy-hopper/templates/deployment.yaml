{{- if eq .Values.configStore.dialect "sqlite" }}
{{- if gt (.Values.replicaCount | int) 1 }}
{{- fail "configStore.dialect=sqlite requires replicaCount=1 — SQLite is single-writer. Use configStore.dialect=postgres for multi-replica deployments." }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- fail "configStore.dialect=sqlite is incompatible with autoscaling.enabled — SQLite is single-writer and cannot scale beyond one replica. Use configStore.dialect=postgres instead." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxy-hopper.fullname" . }}
  labels:
    {{- include "proxy-hopper.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "proxy-hopper.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      annotations:
        # Roll pods when the inline config changes.
        {{- if and (not .Values.config.existingConfigMap) (not .Values.config.existingSecret) }}
        checksum/config: {{ .Values.config.inline | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "proxy-hopper.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "proxy-hopper.serviceAccountName" . }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (eq .Values.backend.type "redis") (eq .Values.configStore.dialect "sqlite") }}
      initContainers:
        {{- if eq .Values.backend.type "redis" }}
        {{- include "proxy-hopper.waitForRedisInitContainer" . | nindent 8 }}
        {{- end }}
        {{- if eq .Values.configStore.dialect "sqlite" }}
        {{- include "proxy-hopper.configStoreMigrateInitContainer" . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "proxy-hopper.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $csEnv := include "proxy-hopper.configStoreUrlEnv" . | trim }}
          {{- if $csEnv }}
          env:
            {{- $csEnv | nindent 12 }}
          {{- end }}
          args:
            - run
            - --config
            - /etc/proxy-hopper/config.yaml
            {{- if .Values.metrics.enabled }}
            - --metrics
            - --metrics-port
            - {{ .Values.metrics.port | quote }}
            {{- end }}
            {{- if eq .Values.backend.type "redis" }}
            - --backend
            - redis
            - --redis-url
            - {{ include "proxy-hopper.redisUrl" . }}
            {{- end }}
          # Runners expose only the proxy port (and optionally metrics).
          # The admin server is a separate Deployment — see admin-deployment.yaml / admin.enabled.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/proxy-hopper
              readOnly: true
            {{- if eq .Values.configStore.dialect "sqlite" }}
            - name: config-store-data
              mountPath: {{ include "proxy-hopper.configStoreSqliteMountPath" . }}
            {{- end }}
      volumes:
        - name: config
          {{- if eq (include "proxy-hopper.configIsSecret" .) "true" }}
          secret:
            secretName: {{ include "proxy-hopper.configName" . }}
          {{- else }}
          configMap:
            name: {{ include "proxy-hopper.configName" . }}
          {{- end }}
        {{- if eq .Values.configStore.dialect "sqlite" }}
        - name: config-store-data
          persistentVolumeClaim:
            claimName: {{ include "proxy-hopper.fullname" . }}-config-store
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
