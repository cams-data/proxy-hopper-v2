{{- if .Values.tokenServer.enabled -}}
{{- if not .Values.tokenServer.image.repository -}}
{{- fail "tokenServer.image.repository is required when tokenServer.enabled=true" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxy-hopper.fullname" . }}-token-server
  labels:
    {{- include "proxy-hopper.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-server
spec:
  replicas: {{ .Values.tokenServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "proxy-hopper.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: token-server
  template:
    metadata:
      {{- with .Values.tokenServer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "proxy-hopper.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: token-server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: token-server
          image: "{{ .Values.tokenServer.image.repository }}:{{ .Values.tokenServer.image.tag }}"
          imagePullPolicy: {{ .Values.tokenServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.tokenServer.port }}
              protocol: TCP
          {{- with .Values.tokenServer.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          {{- with .Values.tokenServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
