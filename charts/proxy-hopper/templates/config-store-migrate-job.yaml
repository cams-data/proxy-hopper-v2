{{- if eq .Values.configStore.dialect "postgres" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "proxy-hopper.fullname" . }}-config-store-migrate
  labels:
    {{- include "proxy-hopper.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "proxy-hopper.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: config-store-migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "proxy-hopper.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["proxy-hopper", "migrate"]
          env:
            {{- include "proxy-hopper.configStoreUrlEnv" . | trim | nindent 12 }}
{{- end }}
