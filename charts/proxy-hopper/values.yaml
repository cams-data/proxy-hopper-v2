# Default values for proxy-hopper.

replicaCount: 1

# Disable Kubernetes service-link env var injection. Keeping this false prevents
# PROXY_HOPPER_PORT (injected by kube for the proxy-hopper Service) from colliding
# with the ServerConfig.port field read by pydantic-settings.
enableServiceLinks: false

image:
  repository: ghcr.io/cams-data/proxy-hopper
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: proxy-hopper.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: proxy-hopper-tls
  #    hosts:
  #      - proxy-hopper.example.com

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 500m
  #   memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# ── Config ─────────────────────────────────────────────────────────────────
# One of three approaches:
#
# 1. Inline config (default) — define config.yaml content directly in values.
# 2. Existing ConfigMap — reference a ConfigMap you manage separately.
# 3. Existing Secret — reference a Secret (for configs containing credentials).
#
# IMPORTANT: when auth is enabled (auth.enabled: true inside config.yaml),
# use approach 3 (existingSecret) so credentials are never stored in a plain
# ConfigMap.  Create the Secret with:
#
#   kubectl create secret generic proxy-hopper-config \
#     --from-file=config.yaml=./config-with-auth.yaml
#
config:
  # Inline config block. Ignored if existingConfigMap or existingSecret is set.
  inline: |
    # Authentication is disabled by default. To enable, add an auth: block here.
    # When using auth, switch to config.existingSecret (see values.yaml comment).
    #
    # auth:
    #   enabled: true
    #   admin:
    #     username: admin
    #     passwordHash: "$2b$12$..."   # proxy-hopper hash-password <password>
    #     role: admin
    #   # API keys are for proxy access only — not the admin API.
    #   # targets: ["*"] allows all targets; list named targets to restrict.
    #   apiKeys:
    #     - name: my-service
    #       key: "ph_changeme"
    #       targets: ["*"]
    #   jwtSecret: "change-me-to-a-long-random-string"
    #   jwtExpiryMinutes: 60
    #
    # Enable the admin API + GraphQL by setting admin.enabled=true in values.yaml.
    # The admin API listens on admin.port (default 8081) and exposes:
    #   POST /auth/login, GET /health, GET /api/v1/status, POST|GET /graphql

    proxyProviders:
      - name: my-provider
        ipList:
          - "10.0.0.1:3128"
          - "10.0.0.2:3128"

    ipPools:
      - name: pool-1
        ipRequests:
          - provider: my-provider
            count: 2

    targets:
      - name: general
        regex: '.*'
        ipPool: pool-1
        minRequestInterval: 1s
        maxQueueWait: 30s
        numRetries: 3
        ipFailuresUntilQuarantine: 5
        quarantineTime: 2m

  # Reference an existing ConfigMap. Key must be "config.yaml".
  # existingConfigMap: ""

  # Reference an existing Secret. Key must be "config.yaml".
  # Recommended when auth is enabled — keeps credentials out of ConfigMaps.
  # existingSecret: ""

# ── Backend ─────────────────────────────────────────────────────────────────
backend:
  # memory or redis
  type: memory

  redis:
    # URL for an external Redis instance. Used when backend.type=redis
    # and the bundled redis subchart is disabled.
    url: ""

# ── Prometheus ───────────────────────────────────────────────────────────────
metrics:
  enabled: false
  # Must match ServerConfig.metrics_port (default 9090).
  port: 9090
  # Creates a Prometheus ServiceMonitor resource.
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

# ── Admin server ─────────────────────────────────────────────────────────────
# When enabled, a separate Deployment + ClusterIP Service are created for the
# admin server. The admin server runs `proxy-hopper admin` — it exposes only
# the management REST API, GraphQL API, and web UI. Proxy runners are
# completely separate and have no admin HTTP endpoints exposed.
#
# Endpoints on the admin server:
#   GET  /health              — liveness check (public)
#   POST /auth/login          — obtain a JWT (requires auth.admin in config.yaml)
#   GET  /api/v1/status       — server state  (requires read permission)
#   POST|GET /graphql         — Strawberry GraphQL API + interactive playground
#
# Auth config (apiKeys, admin user, OIDC, jwtSecret) lives in config.yaml.
# Use config.existingSecret to keep credentials out of ConfigMaps.
admin:
  enabled: false
  replicaCount: 1
  # Port the admin server listens on inside the container.
  port: 8081
  # When true, the admin API rejects every GraphQL mutation — all config
  # comes from config.inline/existingConfigMap/existingSecret only. Queries
  # (status, targets, pools, providers, metrics) are unaffected — the admin
  # server stays fully usable for monitoring. Independent of configStore:
  # with configStore.dialect unset, this is the "no database, YAML-only"
  # deployment kind — a monitoring-only admin server with zero persistence
  # anywhere. With a configStore configured, it instead locks that durable
  # store to changes made only via redeploying config, never via the API.
  readOnly: false
  service:
    type: ClusterIP
  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
    # limits:
    #   cpu: 500m
    #   memory: 256Mi

  # Exposes the admin API + web UI outside the cluster via its own Ingress.
  # Off by default — the admin server has no separate network restriction of
  # its own beyond config.yaml's auth block, so only enable this if you're
  # comfortable relying on that (jwtSecret/admin password) as your perimeter,
  # or you're fronting it with your own additional access control.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: proxy-hopper-admin.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: proxy-hopper-admin-tls
    #    hosts:
    #      - proxy-hopper-admin.example.com

# ── Token server ─────────────────────────────────────────────────────────────
# When enabled, the chart deploys your custom token server alongside
# proxy-hopper (a Deployment + ClusterIP Service) and exposes a predictable
# in-cluster URL.
#
# Your token server image must implement:
#   POST /token  — fetch/refresh a token for a given target + proxy IP
#   GET  /health — liveness check; must return 2xx when ready
#
# The in-cluster service URL is derived automatically as:
#   http://<release-name>-proxy-hopper-token-server:<tokenServer.port>
#
# Wiring into proxy-hopper — add the authServer block to config.inline.
# config.inline is rendered as a Helm template, so you can reference the
# helper directly to keep the URL correct regardless of release name:
#
#   config:
#     inline: |
#       server:
#         authServer:
#           url: '{{ include "proxy-hopper.tokenServerUrl" . }}'
#           timeoutSeconds: 10
#           refreshThresholdSeconds: 60
#           retryIntervalSeconds: 30
#           maxRetries: 5
#           exposeProxyUrl: false
#
#       targets:
#         - name: my-target
#           regex: '.*'
#           authManaged: true
#           ipPool: my-pool
#
# For existingConfigMap / existingSecret, hard-code the URL instead:
#   http://<your-release>-proxy-hopper-token-server:<tokenServer.port>
#
tokenServer:
  enabled: false

  image:
    # REQUIRED when enabled — your token server image.
    # Example: ghcr.io/your-org/my-token-server
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 1

  # Port your token server listens on inside the container.
  # Must match the value used in server.authServer.url in your config.
  port: 9000

  service:
    type: ClusterIP

  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
    # limits:
    #   cpu: 500m
    #   memory: 256Mi

  # Extra environment variables for your token server container.
  env: []
  # - name: REDIS_URL
  #   value: "redis://redis:6379/0"
  # - name: SOME_SECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: value

  podAnnotations: {}

# ── Redis ─────────────────────────────────────────────────────────────────
# Deploys a single first-party Redis StatefulSet (no replication/sentinel —
# use backend.redis.url to point at an external Redis instead if you need
# HA). No auth by default; this is meant for in-cluster use only.
redis:
  enabled: false

  image:
    repository: redis
    tag: 8-alpine
    pullPolicy: IfNotPresent

  persistence:
    enabled: true
    size: 1Gi
    # storageClass: ""   # cluster default if unset

  # fsGroup makes the kubelet chown/chmod the mounted volume to this group at
  # mount time, so redis can write to /data regardless of which UID the
  # container actually ends up running as (the official image only self-chowns
  # /data and drops to its "redis" user when it starts as root — some clusters
  # mutate pods to run non-root by default, which skips that entirely and
  # leaves /data owned by whoever provisioned the PVC, usually root).
  podSecurityContext:
    fsGroup: 999

  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
    # limits:
    #   cpu: 500m
    #   memory: 256Mi

  # Extra args passed to the redis-server entrypoint, e.g. ["--maxmemory", "256mb"]
  extraArgs: []

# ── Config store ─────────────────────────────────────────────────────────────
# Durable storage for provider/pool/target config created via the admin API.
# Unrelated to backend/redis above, which is only operational state (IP
# queues, rate-limit counters, quarantine) — this is what makes admin-API
# config changes survive a pod restart. Off by default: config created via
# the admin API does not survive a restart until you set dialect below,
# same as before this feature existed.
configStore:
  # "" (disabled), "sqlite", or "postgres".
  dialect: ""

  # Required when dialect=postgres. Ignored for dialect=sqlite (the chart
  # manages that file's URL itself, see sqlite.persistence below) and when
  # dialect is unset. existingSecret takes priority if both are set.
  url: ""
  existingSecret: ""
  existingSecretKey: url

  # Only used when dialect=sqlite. The PVC backing the local file, mounted
  # on the main deployment only — SQLite is single-writer, so this does not
  # extend to a separately-enabled admin.* Deployment (it cannot safely
  # share this PVC), and the chart refuses to render if replicaCount>1 or
  # autoscaling.enabled=true for the same reason. Use dialect=postgres if
  # you need config shared across more than one pod.
  sqlite:
    persistence:
      size: 256Mi
      # storageClass: ""   # cluster default if unset

# ── Grafana dashboards ───────────────────────────────────────────────────────
# Creates a ConfigMap with .url keys that the Grafana sidecar picks up and
# fetches from GitHub. Requires the Grafana dashboard sidecar to be configured
# to watch this namespace.
grafana:
  dashboards:
    enabled: false
    # Label key/value the Grafana sidecar watches for. Common values:
    #   grafana_dashboard: "1"   (kube-prometheus-stack default)
    #   grafana_dashboard: "true"
    labelKey: grafana_dashboard
    labelValue: "1"
    # Additional labels to add to the ConfigMap (e.g. to scope to a folder).
    additionalLabels: {}
      # grafana_folder: proxy-hopper
    # Base URL for the dashboard JSON files.
    baseUrl: "https://raw.githubusercontent.com/cams-data/proxy-hopper-v2/next/monitoring/grafana/dashboards"

nodeSelector: {}
tolerations: []
affinity: {}
