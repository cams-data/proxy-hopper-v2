[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "proxy-hopper-token-server"
dynamic = ["version"]
description = "Token server library and runner for Proxy Hopper auth-managed targets"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "aiohttp>=3.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
ph-token-server = "proxy_hopper_token_server.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:[._-](?:a|alpha|b|beta|c|pre|preview|rc)[0-9.]*)?)$"
fallback_version = "0.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/proxy_hopper_token_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
