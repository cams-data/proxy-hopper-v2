[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "proxy-hopper-sql"
dynamic = ["version"]
description = "SQLite/Postgres-backed durable ConfigStore for Proxy Hopper, via SQLAlchemy + Alembic"
requires-python = ">=3.12"
dependencies = [
    "proxy-hopper>=0.1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:[._-](?:a|alpha|b|beta|c|pre|preview|rc)[0-9.]*)?)$"
# Used when building outside a git repo (e.g. Docker, CI source tarballs).
# Override with SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PROXY_HOPPER_SQL env var.
fallback_version = "0.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/proxy_hopper_sql"]

[tool.uv.sources]
proxy-hopper = { path = "../proxy-hopper", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
