apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-hopper-token-server
  namespace: proxy-hopper
  labels:
    app.kubernetes.io/name: proxy-hopper
    app.kubernetes.io/component: token-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxy-hopper
      app.kubernetes.io/component: token-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxy-hopper
        app.kubernetes.io/component: token-server
    spec:
      containers:
        - name: token-server
          # Replace with your registry and tag.
          image: your-registry/your-token-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            # Pass whatever your token server needs.
            - name: TOKEN_SERVER_PORT
              value: "9000"
            # - name: REDIS_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: token-server-secrets
            #       key: redis-url
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # The chart uses /health for both liveness and readiness probes.
          # Your token server must return 2xx from this endpoint when ready.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
