[project]
name = "token-server"
version = "0.1.0"
description = "Example token server for proxy-hopper — demonstrates the POST /token contract"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
# Only needed to run auckland_council.py, the proxy_hopper_token_server-based
# reference example — not required by the Docker-deployed token_server/ app,
# which has no dependency on the library (see its own module docstring).
dev = [
    "proxy-hopper-token-server",
]

[tool.uv.sources]
proxy-hopper-token-server = { path = "../../python_modules/proxy-hopper-token-server", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["token_server"]
